name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - run: dotnet test tests/AbyssMod.Tests/AbyssMod.Tests.csproj -c Release
